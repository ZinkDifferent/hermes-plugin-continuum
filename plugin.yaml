name: continuum
version: 0.1.0
description: "Session continuity engine + enforcement harness. Gap detection with task resumption, mandatory skill matching per task, connection registry, verify-before-act and one-failure-lockout gates."
author: hzink
license: MIT
homepage: https://github.com/ZinkDifferent/hermes-plugin-continuum
tags: [enforcement, continuity, session, gates]
api_version: 1
provides_hooks:
  - on_session_start
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - post_llm_call
provides_commands:
  - continuum

# Skills referenced by the task-skill routing map (DEFAULT_SKILL_MAP in state.py).
# These must be installed in ~/.hermes/skills/ for full Continuum functionality.
# Missing skills are reported via /continuum status as "skills_missing" — the plugin
# still works without them, but task-skill gating won't enforce their loading.
requires_skills:
  # Essential/core set — bundled in this repo under skills/ and installed to
  # ~/.hermes/skills/ by scripts/install-essential-skills.sh (see below).
  - essential_skills
  - the_truth
  - temporal-awareness
  - file-verification-protocol
  - user-correction-protocol
  - humanizer
  # Task-routing skills (NOT bundled; installed only where used). Missing
  # skills are reported via /continuum status as "skills_missing" — the plugin
  # still works without them, but task-skill gating won't enforce their loading.
  - proxmox-ve
  - esxi-proxmox-vm-migration
  - cloudpanel
  - wordpress-router
  - wp-wpcli-and-ops
  - grommunio
  - imap-migration
  - ssl-certificate-management
  - nginx-ssl
  - self-hosted-dns
  - shipment-tracker
  - package-tracking
  - peptide-research
  - protocol-state-management
  - food-logging
  - fatsecret-api-response-patterns
  - withings-health
  - github-pr-workflow
  - github-auth
  - himalaya
  - apple-notes
  - apple-calendar
  - floorplan-creation
  - sweet-home-3d
  - baja-ventures-site
  - kumberland-site-consolidation